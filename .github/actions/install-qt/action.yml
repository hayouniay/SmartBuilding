name: Install Qt
description: Install Qt for Linux (GCC) or Windows (MinGW) and expose the resolved Qt installation path.

inputs:
  target:
    description: "Target platform: linux or windows"
    required: true

  qt-version:
    description: "Qt version to install, e.g. 6.8.0"
    required: true

outputs:
  qt-path:
    description: "Resolved Qt installation prefix"
    value: ${{ steps.resolve-linux.outputs.qtPath || steps.resolve-windows.outputs.qtPath }}

runs:
  using: composite
  steps:
    # --------------------------------------------------
    # Linux: install Qt with GCC
    # --------------------------------------------------
    - name: Install Qt (Linux)
      id: qt-linux
      if: inputs.target == 'linux'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        arch: linux_gcc_64
        cache: true
        cache-key-prefix: qt-linux

    - name: Resolve Qt path (Linux)
      id: resolve-linux
      if: inputs.target == 'linux'
      shell: bash
      env:
        ACTION_QT_PATH: ${{ steps.qt-linux.outputs.qtPath }}
      run: |
        set -euo pipefail

        qt="${ACTION_QT_PATH:-${QT_ROOT_DIR:-}}"

        if [[ -z "$qt" ]]; then
          echo "::error::Qt path is empty. Neither qtPath output nor QT_ROOT_DIR is set."
          exit 1
        fi

        if [[ ! -d "$qt" ]]; then
          echo "::error::Qt installation directory not found: $qt"
          exit 1
        fi

        echo "Resolved Qt path: $qt"
        echo "qtPath=$qt" >> "$GITHUB_OUTPUT"

    - name: Install Qt (Windows, MinGW)
      id: qt-windows
      if: inputs.target == 'windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        arch: win64_mingw
        tools: tools_mingw1310
        cache: true
        cache-key-prefix: qt-windows

    - name: Resolve Qt path (Windows)
      id: resolve-windows
      if: inputs.target == 'windows'
      shell: pwsh
      env:
        ACTION_QT_PATH: ${{ steps.qt-windows.outputs.qtPath }}
      run: |
        $qt = $env:ACTION_QT_PATH

        if ([string]::IsNullOrWhiteSpace($qt)) {
          $qt = $env:QT_ROOT_DIR
        }

        if ([string]::IsNullOrWhiteSpace($qt)) {
          throw "Qt path is empty. Neither qtPath output nor QT_ROOT_DIR is set."
        }

        if (-not (Test-Path -LiteralPath $qt -PathType Container)) {
          throw "Qt installation directory not found: $qt"
        }

        "qtPath=$qt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        Write-Host "Resolved Qt path: $qt"

    - name: Put MinGW on PATH (Windows)
      if: inputs.target == 'windows'
      shell: pwsh
      env:
        QT_PATH: ${{ steps.resolve-windows.outputs.qtPath }}
      run: |
        $qt = $env:QT_PATH

        if ([string]::IsNullOrWhiteSpace($qt)) {
          throw "Qt path is empty; cannot configure MinGW."
        }

        $qtVersionDir = Split-Path -Parent $qt
        $qtInstallRoot = Split-Path -Parent $qtVersionDir

        $toolsRoot = $env:IQTA_TOOLS
        if ([string]::IsNullOrWhiteSpace($toolsRoot)) {
          $toolsRoot = Join-Path $qtInstallRoot 'Tools'
        }

        $mingw = Join-Path $toolsRoot 'mingw1310_64\bin'
        $compiler = Join-Path $mingw 'g++.exe'

        if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
          throw "MinGW compiler not found at '$compiler'. IQTA_TOOLS='$env:IQTA_TOOLS'"
        }

        $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
        Write-Host "MinGW added to PATH: $mingw"
        & $compiler --version
