name: Install Qt
description: Install Qt for Linux (GCC) or Windows (MinGW) and output the Qt prefix.

inputs:
  target:
    description: "Target platform: linux or windows"
    required: true

  qt-version:
    description: "Qt version to install, e.g. 6.8.0"
    required: true

outputs:
  qt-path:
    description: "Qt installation prefix"
    value: ${{ steps.qt-linux.outputs.qtPath || steps.qt-windows.outputs.qtPath }}

runs:
  using: composite
  steps:
    # --------------------------------------------------
    # Linux: install Qt with GCC
    # --------------------------------------------------
    - name: Install Qt (Linux)
      id: qt-linux
      if: inputs.target == 'linux'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        arch: linux_gcc_64
        cache: true
        cache-key-prefix: qt-linux

    # --------------------------------------------------
    # Windows: install Qt with MinGW
    # --------------------------------------------------
    - name: Install Qt (Windows, MinGW)
      id: qt-windows
      if: inputs.target == 'windows'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ inputs.qt-version }}
        arch: win64_mingw
        tools: tools_mingw1310
        cache: true
        cache-key-prefix: qt-windows

    # --------------------------------------------------
    # Windows: locate MinGW and add it to PATH
    # --------------------------------------------------
    - name: Put MinGW on PATH (Windows)
      if: inputs.target == 'windows'
      shell: pwsh
      env:
        QT_PATH: ${{ steps.qt-windows.outputs.qtPath }}
        QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        IQTA_TOOLS: ${{ env.IQTA_TOOLS }}
      run: |
        $ErrorActionPreference = 'Stop'

        # Resolve the Qt installation prefix.
        $qtPath = $env:QT_PATH

        if ([string]::IsNullOrWhiteSpace($qtPath)) {
          $qtPath = $env:QT_ROOT_DIR
        }

        if ([string]::IsNullOrWhiteSpace($qtPath)) {
          throw "Qt path is empty. Check install-qt-action outputs."
        }

        $toolsRoot = $env:IQTA_TOOLS

        if ([string]::IsNullOrWhiteSpace($toolsRoot)) {
          $toolsRoot = Join-Path (Split-Path -Parent (Split-Path -Parent $qtPath)) 'Tools'
        }

        $mingw = Join-Path $toolsRoot 'mingw1310_64\bin'

        if (-not (Test-Path (Join-Path $mingw 'g++.exe'))) {
          throw "MinGW compiler not found: $mingw"
        }

        # Add MinGW to PATH for subsequent GitHub Actions steps.
        $mingw | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

        Write-Host "Qt path: $qtPath"
        Write-Host "MinGW added to PATH: $mingw"
